apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ica0022
  labels:
    app: ica0022-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ica0022-app
  template:
    metadata:
      labels:
        app: ica0022-app
    spec:
      containers:
        - name: app
          image: ica0022:v1.2.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Gi
            limits:
              memory: 64Gi