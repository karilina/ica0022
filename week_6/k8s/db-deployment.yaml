apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ica0022
  labels:
    app: ica0022-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ica0022-db
  template:
    metadata:
      labels:
        app: ica0022-db
    spec:
      volumes:
        - name: init
          configMap:
            name: db-init
        - name: data
          persistentVolumeClaim:
            claimName: db-data
      containers:
        - name: postgres
          image: postgres:17-bookworm
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              value: ica0022
            - name: POSTGRES_USER
              value: ica0022
          envFrom:
            - secretRef:
                name: db-credentials
