apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ica0022
  labels:
    app: ica0022-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ica0022-app
  template:
    metadata:
      labels:
        app: ica0022-app
    spec:
      containers:
        - name: app
          image: ica0022:v1.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
