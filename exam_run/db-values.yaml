fullnameOverride: "db"

image:
  repository: postgres
  tag: 17-bookworm
  pullPolicy: IfNotPresent

auth:
  database: "ica0022"
  username: "ica0022"
  password: "ica0022"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: "ebs-csi-default-sc"
  # Subdirectory on the volume; a formatted disk is not an empty directory.
  subPath: pgdata

initdb:
  enabled: true
  scripts:
    init.sql: |
      CREATE TABLE IF NOT EXISTS counter (
          id integer PRIMARY KEY CHECK (id = 1),
          visits bigint NOT NULL DEFAULT 0
      );
      INSERT INTO counter (id, visits)
      VALUES (1, 0)
      ON CONFLICT (id) DO NOTHING;

service:
  port: 5432
