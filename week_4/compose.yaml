name: week4

services:
  app:
    image: ica0022:v1.1.0
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ica0022
      DB_USER: ica0022
      DB_PASSWORD: ica0022-pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ica0022
      POSTGRES_USER: ica0022
      POSTGRES_PASSWORD: ica0022-pass
    volumes:
      - db-data:/var/lib/postgresql/data
      - type: bind
        source: ./init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ica0022", "-d", "ica0022"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

networks:
  backend:
    driver: bridge
  isolated:
    driver: bridge

volumes:
  db-data:
