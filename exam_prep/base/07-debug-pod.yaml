# Helper pod for network checks: kubectl exec -it debug -- sh
# (a plain `kubectl run` would be rejected by the quota, since it has no resources)
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: exam-practice
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 32Mi}
