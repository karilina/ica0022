apiVersion: v1
kind: Secret
metadata:
  name: inc12-db-auth
  namespace: exam-practice
type: Opaque
stringData:
  POSTGRES_PASSWD: inc12-pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inc12-db
  namespace: exam-practice
  labels:
    app: inc12-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inc12-db
  template:
    metadata:
      labels:
        app: inc12-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-bookworm
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inc12
            - name: POSTGRES_USER
              value: inc12
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inc12-db-auth
                  key: POSTGRES_PASSWORD
                  optional: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inc12-db
  namespace: exam-practice
spec:
  selector:
    app: inc12-db
  ports:
    - port: 5432
      targetPort: 5432
