apiVersion: apps/v1
kind: Deployment
metadata:
  name: inc11
  namespace: exam-practice
  labels:
    app: inc11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inc11
  template:
    metadata:
      labels:
        app: inc11
    spec:
      containers:
        - name: app
          image: ica0022:v1.2.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
