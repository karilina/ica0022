apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inc13-data
  namespace: exam-practice
spec:
  storageClassName: premium-ssd
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inc13-db
  namespace: exam-practice
  labels:
    app: inc13-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inc13-db
  template:
    metadata:
      labels:
        app: inc13-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-bookworm
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inc13-data
