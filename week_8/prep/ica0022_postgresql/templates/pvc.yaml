apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ica0022-postgresql.fullname" . }}-data
  labels:
    {{- include "ica0022-postgresql.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
