apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ica0022-postgresql.fullname" . }}-credentials
  labels:
    {{- include "ica0022-postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.auth.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
