apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: TODO
  labels:
    app: TODO
spec:
  replicas: 2
  selector:
    matchLabels:
      app: TODO
  template:
    metadata:
      labels:
        app: TODO
    spec:
      containers:
        - name: app
          image: TODO
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ica0022
            - name: DB_USER
              value: ica0022
            - name: DB_PASSWORD
              value: ica0022-pass